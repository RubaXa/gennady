notes: >
  Found while authoring fixtures: `git grep` searches tracked content, so a NEWLY ADDED generator
  file was invisible in --all mode and the drift gate silently skipped — hiding exactly the codegen
  a change introduces. `--untracked` fixes it; here the directive lives in an uncommitted file and
  its output is missing, so the gate must FAIL rather than skip.
requires: [go]
dirty:
  gen.go: "package main\n\n//go:generate sh -c \"printf fresh > gen.out\"\n"
argv: ['--all']
exitCode: 1
treeUnchanged: false
gates:
  golang:generate:
    status: fail
    outputIncludes: ['gen.out']
