# D-60: this project's draft release gate covers its mandatory deterministic corpus. Experimental
# inbox/agent-mon and real-network integration remain explicit opt-ins, not pre-commit work.
# Public Node presets and the explicit integration phase retain their normal integration duty.
verify:
  presets:
    node:
      # The standalone lint script also runs format and type-check. Verify already owns
      # those mandatory observations, so select only its contract-lint leaf here.
      steps:
        lint:
          command:
            npmScript: lint:contracts
      phases:
        full:
          include: [code, unit, coverage]
