notes: >
  D-STACK-013 sandboxLinks: node_modules is gitignored, so the run replica cannot contain it by
  copy (D-STACK-012 fresh-clone semantics). The gate passes only because the node plugin declares
  node_modules as an environment link that is symlinked into the replica. `dirty` creates the dep
  after the baseline commit, exactly as a real `npm install` would leave it — ignored, not tracked.
requires: [npm]
argv: ['--all']
exitCode: 0
dirty:
  node_modules/tiny-dep/package.json: '{ "name": "tiny-dep", "version": "1.0.0", "main": "index.js" }'
  node_modules/tiny-dep/index.js: 'module.exports = 42;'
gates:
  node:test: { status: pass }
