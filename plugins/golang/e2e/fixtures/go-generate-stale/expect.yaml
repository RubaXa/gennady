notes: >
  D-STACK-011: committed generated output that drifted from its sources is a FAIL naming the files
  and pointing at `gennady fix`; clean-tree guard rolls the generated drift back before the next gate.
requires: [go]
argv: ['--all']
exitCode: 1
gates:
  golang:generate:
    status: fail
    outputIncludes: ['gen.out', 'gennady fix golang:generate']
