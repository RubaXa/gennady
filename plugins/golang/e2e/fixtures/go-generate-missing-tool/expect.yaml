notes: >
  D-STACK-012 through the installed CLI: a generator binary that is not in PATH is a broken
  environment, not a code finding, and the hint must name the fix. The guarded real-tree runner
  preserves the installed environment while enforcing non-ignored drift after execution.
requires: [go]
argv: ['--all']
exitCode: 1
gates:
  golang:generate:
    status: env-fail
    hintIncludes: 'go install'
