notes: >
  D-STACK-013: a gate that writes without declaring driftMeansFailure is a VIOLATION naming the
  files, and clean-tree guard rolls the write back before the next gate.
requires: [go]
argv: ['--all']
exitCode: 1
gates:
  golang:dirty:
    status: violation
    outputIncludes: ['junk.txt', 'driftMeansFailure']
