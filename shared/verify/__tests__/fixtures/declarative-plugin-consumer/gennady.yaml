verify:
  presets:
    node:
      phases:
        consumer:
          include: [consumer]
      steps:
        consumer-command:
          tags: [consumer]
          executor: local
          effect: repair
          command:
            argv: [node, consumer-command.mjs]
            cwd: .
          writes:
            root: .
            include: [custom-output.txt]
            exclude: [.git/**]
          timeout: 5s
          onFailure: stop-phase
